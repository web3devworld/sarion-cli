name: Native candidate qualification
on:
  push:
    branches: ["feat/cli-v2-m1-m4"]
    paths:
      [
        "apps/**",
        "packages/**",
        "scripts/**",
        "tests/**",
        "package*.json",
        ".github/workflows/qualify.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Pin native filesystem helper
        shell: bash
        run: python -c "import os,sys; open(os.environ['GITHUB_ENV'],'a').write('SARION_PYTHON='+sys.executable+chr(10))"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: node --experimental-transform-types --test tests/client.test.mjs tests/network.test.mjs tests/native.test.mjs
      - run: npm run pack:release
      - run: node scripts/sbom.mjs
      - run: npm audit --omit=dev --audit-level=high
